name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Algeda.slnx

      - name: Build
        run: dotnet build Algeda.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Algeda.slnx -c Release --no-build

      - name: Audit NuGet packages
        run: dotnet list Algeda.slnx package --vulnerable --include-transitive --no-restore

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.41.9
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=http://10.0.2.2:5142
          --dart-define=WEB_BASE_URL=http://10.0.2.2:5000
